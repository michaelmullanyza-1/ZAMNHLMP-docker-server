// Copy to $SERVER_PATH/config/server.cfg and edit.
// This file lives outside the Steam installation and is reapplied on startup,
// so updates cannot overwrite it.

hostname "ZAMN Dedicated Server"

// Leave empty for a public server, or set a join password.
sv_password ""

sv_lan 0
mapcyclefile "default"
sv_wateramp 0
pausable 0
sv_airaccelerate 100
sv_maxupdaterate 60
sv_rollangle 0
sv_allow_download 1
sv_allow_upload 1
sv_allow_shaders 1
sv_clienttrace 3.5
sv_allowdownload 1
sv_allowupload 1
sv_alltalk 1
mp_timelimit 25
log on
mp_logdetail 3

// Keep secrets out of this file and out of git.
// Put rcon_password in $SERVER_PATH/config/rcon.cfg instead, then:
exec rcon.cfg

exec listip.cfg
exec banned.cfg
