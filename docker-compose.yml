name: zamn

x-runtime: &runtime
  image: ${STEAMCMD_IMAGE:-gameservermanagers/steamcmd@sha256:223bf8691bd2662bfa05ed5e3112651fc0f86491ca4590afc0e362983a3e1e6d}
  user: "${PUID:-1000}:${PGID:-1000}"
  init: true
  working_dir: /srv
  environment:
    HOME: /srv/steam-home
    LANG: C.UTF-8
    SERVER_PORT: "${SERVER_PORT:-27015}"
    START_MAP: "${START_MAP:-crossfire}"
    MAX_PLAYERS: "${MAX_PLAYERS:-16}"
    SERVER_APPID: "${SERVER_APPID:-3807180}"
    UPDATE_ON_START: "${UPDATE_ON_START:-1}"
    UPDATE_TIMEOUT_SECONDS: "${UPDATE_TIMEOUT_SECONDS:-600}"
    RUNTIME_IMAGE: "${STEAMCMD_IMAGE:-gameservermanagers/steamcmd@sha256:223bf8691bd2662bfa05ed5e3112651fc0f86491ca4590afc0e362983a3e1e6d}"
  volumes:
    - ${SERVER_PATH:?SERVER_PATH must be set in .env}/data:/srv
    - ${SERVER_PATH:?SERVER_PATH must be set in .env}/config:/config:ro
    - ./scripts:/scripts:ro
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  server:
    <<: *runtime
    container_name: ${CONTAINER_NAME:-zamn-server}
    entrypoint: ["/bin/bash", "/scripts/boot.sh"]
    restart: unless-stopped
    stop_signal: SIGINT
    stop_grace_period: 30s
    ports:
      - "${SERVER_PORT:-27015}:${SERVER_PORT:-27015}/udp"
      - "${SERVER_PORT:-27015}:${SERVER_PORT:-27015}/tcp"
    healthcheck:
      test: ["CMD", "/bin/bash", "/scripts/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      start_period: 12m
      retries: 3